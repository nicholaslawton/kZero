[package]
name = "kz-misc"
version = "0.1.0"
edition = "2021"

[features]
muzero = ["kz-core/muzero", "kz-selfplay/muzero"]
default = []

[[bin]]
name = "play_oriflambe"
path = "oriflambe_bins/play_oriflambe.rs"

[[bin]]
name = "play_oriflambe_gui"
path = "oriflambe_bins/play_oriflambe_gui.rs"

[[bin]]
name = "evaluate_oriflambe"
path = "oriflambe_bins/evaluate_oriflambe.rs"

[[bin]]
name = "evaluate_oriflambe_ratings"
path = "oriflambe_bins/evaluate_oriflambe_ratings.rs"

[[bin]]
name = "write_oriflambe_mapping"
path = "oriflambe_bins/write_oriflambe_mapping.rs"

[dependencies]
board-game.workspace = true
hexx.workspace = true
kn-cuda-eval.workspace = true
kn-cuda-sys.workspace = true
kn-graph.workspace = true
kz-core.workspace = true
kz-selfplay.workspace = true
kz-util.workspace = true
pgn-reader.workspace = true

bzip2.workspace = true
clap.workspace = true
crossbeam.workspace = true
crossterm.workspace = true
decorum.workspace = true
flume.workspace = true
futures.workspace = true
image.workspace = true
internal-iterator.workspace = true
itertools.workspace = true
ndarray.workspace = true
palette.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tabled.workspace = true
tar.workspace = true
tui.workspace = true
vampirc-uci.workspace = true
env_logger = "0.11.10"
iced = { version = "0.14.0", features = ["advanced", "canvas", "smol", "svg"] }
nypc-perf = "0.1.2"
